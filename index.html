<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple, thoughtful place to keep track of what you need to do."
    />
    <title>Little Things — To-do list</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Little Things home">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span>little things</span>
        </a>
        <span class="today-label" id="today-label"></span>
      </header>

      <section class="todo-card" aria-labelledby="page-title">
        <div class="card-heading">
          <div>
            <p class="eyebrow">A fresh start, any day</p>
            <h1 id="page-title">Make room<br />for <em>what matters.</em></h1>
          </div>
          <div class="sun-doodle" aria-hidden="true">
            <span>✦</span>
          </div>
        </div>

        <form class="task-form" id="task-form">
          <label class="sr-only" for="task-input">Add a task</label>
          <input
            id="task-input"
            name="task"
            type="text"
            maxlength="120"
            placeholder="What’s on your mind?"
            autocomplete="off"
            required
          />
          <button class="add-button" type="submit">
            <span aria-hidden="true">+</span>
            <span>Add task</span>
          </button>
        </form>

        <div class="list-toolbar">
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter-button is-active" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter-button" type="button" data-filter="active" aria-pressed="false">To do</button>
            <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Done</button>
          </div>
          <span class="task-count" id="task-count" aria-live="polite"></span>
        </div>

        <ul class="task-list" id="task-list" aria-label="Your tasks"></ul>

        <div class="empty-state" id="empty-state">
          <span class="empty-icon" aria-hidden="true">☁</span>
          <p class="empty-title">A little space to breathe.</p>
          <p class="empty-copy">Add a task above and take it one thing at a time.</p>
        </div>

        <footer class="card-footer">
          <p><span class="footer-sparkle" aria-hidden="true">✦</span> Small steps still move you forward.</p>
          <button class="clear-button" id="clear-completed" type="button" hidden>Clear completed</button>
        </footer>
      </section>

      <p class="page-note">Made for your everyday, not your someday.</p>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
